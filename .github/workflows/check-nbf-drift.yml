# Daily watch on National Bank's syndicated content.
#
# The News page and the advisor profile pages are NOT this team's content — NBF
# renders them from a central AEM Experience Fragment and from structured
# advisor records, and edits them on its own schedule. On the reference project
# three link swaps landed in the six days between capture and review. A static
# build freezes all of that, so this job is the standing replacement for the
# automatic updating the advisor loses at launch.
#
# It REPORTS ONLY. It never edits the repo, never opens a PR against content,
# and nothing it finds may be applied without a row in CHANGES-FOR-APPROVAL.md.
#
# Reads only ordinary public page URLs on fbngp.ca / nbfwm.ca — the same ones a
# visitor loads. See the header of scripts/check-nbf-drift.mjs for why it does
# not touch the experience-fragment JSON (robots.txt: `Disallow: /content/*`).

name: NBF content drift

on:
  schedule:
    # 11:00 UTC daily — roughly 07:00 in Montréal, so a report is waiting at the
    # start of the business day. Cron on GitHub is best-effort, not to the minute.
    - cron: '0 11 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: nbf-drift
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # No install step: the checker uses only Node built-ins.
      - name: Check for drift
        id: drift
        run: |
          set +e
          node scripts/check-nbf-drift.mjs | tee drift-report.txt
          echo "status=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Summarise
        if: always()
        run: |
          {
            echo '### NBF content drift'
            echo
            echo '```'
            cat drift-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Exit 2 means NBF was unreachable — a transient network problem, not
      # drift. Surfaced in the summary, but it does not raise an issue.
      - name: Open an issue when NBF content has moved
        if: steps.drift.outputs.status == '1'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('drift-report.txt', 'utf8');
            const title = 'NBF content drift detected';
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'nbf-drift',
            });
            const body = [
              'National Bank has changed content the build reproduces.',
              '',
              '```',
              report.trim(),
              '```',
              '',
              '**Do not apply anything from this report directly.** Every change to',
              'NBF content goes through `CHANGES-FOR-APPROVAL.md` — the S-series for',
              'the syndicated news block, the AP-series for the advisor pages.',
              '',
              `Run: \`npm run check:nbf\` · [workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
            ].join('\n');

            if (open.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['nbf-drift'],
              });
            }

      - name: Fail the run when drift was found
        if: steps.drift.outputs.status == '1'
        run: exit 1
